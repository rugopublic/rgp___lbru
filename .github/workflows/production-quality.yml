name: Production quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel PHP ${{ matrix.php }} / MySQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: likablog_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: likablog_testing
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, mysqli, pdo_mysql, zip
          coverage: none
          tools: composer:v2
      - name: Prepare environment
        run: |
          if [[ -f .env.example ]]; then cp .env.example .env; else printf 'APP_KEY=\n' > .env; fi
          grep -q '^APP_KEY=' .env || printf '\nAPP_KEY=\n' >> .env
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate application key
        run: php artisan key:generate --force
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend assets
        run: bun run build
      - name: Run Laravel test suite
        run: php artisan test
      - name: Install static audit dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Audit documentation coverage
        run: bash qa/documentation-audit.sh
      - name: Run production static gate
        run: bash qa/production-audit.sh
      - name: Run eight regression passes
        run: bash qa/run-8-passes.sh
